# Raspberry Pi 5 GPS/PPS Stratum-1 time server

# Retain independent network sources for startup, sanity checking, and holdover.
pool 2.debian.pool.ntp.org iburst maxsources 4

# GPSD publishes serial GNSS time-of-day data to NTP shared memory unit 0.
# noselect prevents variable UART delay from steering the system clock.
refclock SHM 0 refid gnss offset 0.0 precision 1e-3 poll 0 filter 3 noselect

# Read PPS from the kernel and lock each pulse to the GNSS UTC second.
refclock PPS /dev/pps0 refid pps lock gnss offset 0.0 precision 1e-7 poll 3 prefer trust

# Replace this example with the actual NTP client subnet.
allow 192.168.1.0/24

keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony

makestep 1.0 3
rtcsync
leapsectz right/UTC

log tracking measurements statistics
